<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Fashion Companion</title>
    <meta
      name="description"
      content="A closet manager that suggests outfits with a hand-written decision tree and shows the exact rules behind every suggestion. Runs entirely in your browser."
    />
    <meta name="author" content="Negin Mousavi" />
    <link rel="canonical" href="https://ngnmsv.github.io%BASE_URL%" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Fashion Companion" />
    <meta
      property="og:description"
      content="Outfit suggestions from a decision tree you can read. Runs entirely in your browser."
    />
    <meta property="og:url" content="https://ngnmsv.github.io%BASE_URL%" />
    <meta property="og:image" content="https://ngnmsv.github.io%BASE_URL%og.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#f3efe7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12100d" media="(prefers-color-scheme: dark)" />

    <!--
      Pick the theme before the first paint so the page never flashes the
      wrong colours: the visitor's saved choice, otherwise the system setting.
    -->
    <script>
      ;(function () {
        var saved = null
        try {
          saved = localStorage.getItem('fc-theme')
        } catch (e) {}
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="max-width: 40rem; margin: 3rem auto; padding: 0 1rem; font-family: sans-serif">
        Fashion Companion needs JavaScript to run.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
